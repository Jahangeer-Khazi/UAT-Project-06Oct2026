<html>

<head>
    <link rel="stylesheet" href="style2.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="http://cdnjs.cloudflare.com/ajax/libs/ocanvas/2.10.0/ocanvas.min.js"></script>
    <script src="index.js"></script>
    <style>
        body {
            background-image: url("./images/bg.png");
            background-repeat: no-repeat;
            background-size: cover;
            height: 100%;
            animation: mymove 3s both;
        }

        @keyframes mymove {
            from {
                background-image: url("./images/bg.png");
                background-repeat: no-repeat;
                background-size: cover;
            }

            to {
                background-image: url("./images/splash.png");
                background-repeat: no-repeat;
                background-size: cover;
            }
        }
    </style>
</head>

<body>
    <div id="container">

        <div id="controls">
            <div class="main">

                <div class="logo">
                    <img class="ila-logo" src="./images/logo.png">
                </div>

                <div class="winner">
                    <div>Congratulations to our 2nd winner</div>
                </div>

                <div class="winner-cif">
                    <div>Fajer Ali Salman Alshaikh 6664456</div>
                </div>

                <div class="prize">
                    <div class="prize-child">
                    <div class="prize-num">Your Prize 💰</div>
                    <div class="prize-amount">
                        <span class="currency">BHD</span>
                        <span class="amount">8,000</span>
                        <span class="decimal">.000</span>
                    </div>
                </div>
                </div>
                <div class="finish-btn-parent">
                    <div class="finish-btn">
                        <div onclick="location.href = 'page3.html';">Finish</div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</body>

</html>
