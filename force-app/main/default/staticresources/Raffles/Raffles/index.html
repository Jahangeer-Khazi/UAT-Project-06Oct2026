<html>

<head>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="http://cdnjs.cloudflare.com/ajax/libs/ocanvas/2.10.0/ocanvas.min.js"></script>
    <script src="index.js"></script>
</head>

<body>
    <div id="container">
        <canvas id="canvas"> </canvas>
        <div id="controls">
            <div class="main">
                <div class="logo-parent">
                    <div class="logo">
                        <img class="ila-logo" src="./images/logo.png">
                    </div>
                </div>
                <div class="campaign-parent">
                    <div class="campaign">
                        KANZ CAMPAIGN
                    </div>
                </div>
                <div class="big-title">
                    Big Summer Draw
                </div>

                 <div class="prize">
                    <div class="prize-num">
                        <span>💰 Prize to win
                        </span>
                        </div>
                    <div class="prize-amount">
                        <sup class="currency">BHD</sup>
                        <span class="amount">10,000</span>
                        <sup class="decimal">.000</sup>
                    </div>
                </div>

                <div class="prizes-boxes">
                    <div class="boxes">
                        <div class="box">
                            <div><img src="./images/prize-icon-1.png" /></div>
                            <div class="prize-pos">First Prize</div>
                            <div class="winners-prize-amount">
                                BHD 10,000<span class="prize-no-winners"> x 3</span>
                            </div>
                        </div>
                        <div class="box">
                            <div><img src="./images/prize-icon-2.png" /></div>
                            <div class="prize-pos">First Prize</div>
                            <div class="winners-prize-amount"> BHD 5,000 <span class="prize-no-winners"> x 10</span></div>
                        </div>
                        <div class="box">
                            <div><img src="./images/prize-icon-3.png" /></div>
                            <div class="prize-pos">Third Prize</div>
                            <div class="winners-prize-amount">BHD 1,000<span class="prize-no-winners"> x 20</span></div>
                        </div>
                    </div>
                </div> 



            </div>
            <div class="raffle-parent">
                <div class="raffle">
                    <input type="button" class="raffle-btn" value="Start Raffle"
                        onclick="location.href = 'page1.html';">
                </div>
            </div>
        </div>
    </div>
</body>

</html>
